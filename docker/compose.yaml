# The dashboard in Docker (ADR-0040): the Django API and the Next.js interface, in the same network namespace. The
# engine stays on the host. It starts with `task docker:up`, which provides AGENCY_DATA_DIR, AGENCY_UID and AGENCY_GID.
#
# This file is in docker/ and not at the root: Compose reads the project folder's .env by itself for its
# variables, and the root one holds the API key. There is no .env, env_file or key here.
name: design-agency-dashboard

# Every container without privileges, with a read-only disk and an init that forwards signals.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true

services:
  api:
    <<: *hardened
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    image: design-agency/dashboard-api:local
    # The host's user: the files SQLite creates while reading the registry stay theirs, and the engine rewrites them.
    user: "${AGENCY_UID:?AGENCY_UID manca. Si avvia con task docker:up}:${AGENCY_GID:?AGENCY_GID manca. Si avvia con task docker:up}"
    environment:
      AGENCY_DATA_DIR: /data
      AGENCY_PROJECTION_DIR: /projection
    volumes:
      # The registry, the traces and the transcripts. Not read-only: to read a WAL registry closed by the engine,
      # SQLite must create its -shm, and on a read-only mount it cannot open it (ADR-0040). The server writes nothing
      # else: a mode=ro connection, query_only, a GET-only API, as when it runs on the host.
      - type: bind
        source: "${AGENCY_DATA_DIR:?AGENCY_DATA_DIR, la cartella del registro, manca. Si avvia con task docker:up}"
        target: /data
    # The insights projection lives in memory: it is rebuilt at every start, and the container adds no file to the registry.
    tmpfs:
      - /projection
      - /tmp
    # The interface's port, only on the machine's 127.0.0.1: web shares this service's network, and
    # Django stays on the container's 127.0.0.1, with no published port.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 2s
      timeout: 2s
      retries: 30

  web:
    <<: *hardened
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: design-agency/dashboard-web:local
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
    tmpfs:
      - /tmp
