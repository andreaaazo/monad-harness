[project]
name = "design-agency-harness"
version = "0.1.0"
description = "Harness proprietario della design agency: orchestrazione, contratti, Craft headless, QA e costi."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "anthropic>=1",
  "langgraph>=1",
  "langgraph-checkpoint-sqlite>=2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlmodel>=0.0.22",
  "opentelemetry-sdk>=1.30",
  "pillow>=11",
  "alembic>=1.20.0",
  "django>=5.2,<5.3",
  "django-ninja>=1.4",
  "sqlalchemy>=2.1.5",
  "langchain-core>=1.6.12",
]

[project.scripts]
agency = "agency.cli:main"
agency-server = "agency.entrypoints.server.serve:main"
agency-schemas = "agency.entrypoints.server.schema:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "pyright>=1.1.390",
    "import-linter>=2.15",
    "django-stubs>=5.2,<5.3",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agency"]

[tool.uv]
# No package published less than two weeks ago: a defense against supply-chain compromise (ADR-0006).
exclude-newer = "2026-10-17T00:00:00Z"

[tool.ruff]
line-length = 110
src = ["src", "tests"]
extend-exclude = ["legacy", "src/agency/qa/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The multiplication sign of sizes ("98 × 118.5 px") is meant; every other look-alike character still fails.
allowed-confusables = ["×"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["legacy", "src/agency/qa/scripts"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
  "sandbox: runs a command in the engine's bwrap sandbox; the session stops at once if the sandbox does not work",
]
addopts = "-q"

[tool.importlinter]
root_package = "agency"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "insights only reads: no engine, no Ledger, no engine libraries (ADR-0019)"
type = "forbidden"
source_modules = ["agency.insights"]
forbidden_modules = [
  "agency.agents",
  "agency.artifacts",
  "agency.cli",
  "agency.config",
  "agency.context",
  "agency.doctor",
  "agency.evaluation",
  "agency.gateway",
  "agency.ledger",
  "agency.process",
  "agency.qa",
  "agency.registry",
  "agency.studio",
  "agency.telemetry",
  "agency.toolkit",
  "agency.workshop",
  "alembic",
  "anthropic",
  "langgraph",
  "sqlalchemy",
  "sqlmodel",
]

[[tool.importlinter.contracts]]
name = "the engine imports neither Django nor the server: Django reads through insights (ADR-0020)"
type = "forbidden"
# Every package but the entry points, listed by hand: a test checks that none is missing.
source_modules = [
  "agency.agents",
  "agency.artifacts",
  "agency.cli",
  "agency.config",
  "agency.context",
  "agency.contracts",
  "agency.doctor",
  "agency.evaluation",
  "agency.gateway",
  "agency.insights",
  "agency.ledger",
  "agency.process",
  "agency.qa",
  "agency.registry",
  "agency.studio",
  "agency.telemetry",
  "agency.toolkit",
  "agency.workshop",
]
forbidden_modules = ["django", "ninja", "agency.entrypoints"]

[[tool.importlinter.contracts]]
name = "the server only reads: no engine, no Ledger, no .env (ADR-0019)"
type = "forbidden"
source_modules = ["agency.entrypoints.server"]
forbidden_modules = [
  "agency.agents",
  "agency.artifacts",
  "agency.cli",
  "agency.config",
  "agency.context",
  "agency.doctor",
  "agency.evaluation",
  "agency.gateway",
  "agency.ledger",
  "agency.process",
  "agency.qa",
  "agency.registry",
  "agency.studio",
  "agency.telemetry",
  "agency.toolkit",
  "agency.workshop",
  "alembic",
  "anthropic",
  "langgraph",
  "sqlalchemy",
  "sqlmodel",
]

[[tool.importlinter.contracts]]
name = "the judgment depends only on the contracts: no engine, no registry (ADR-0027)"
type = "forbidden"
source_modules = ["agency.evaluation"]
forbidden_modules = [
  "agency.agents",
  "agency.artifacts",
  "agency.cli",
  "agency.config",
  "agency.context",
  "agency.doctor",
  "agency.gateway",
  "agency.insights",
  "agency.ledger",
  "agency.process",
  "agency.qa",
  "agency.registry",
  "agency.studio",
  "agency.telemetry",
  "agency.toolkit",
  "agency.workshop",
  "alembic",
  "anthropic",
  "langgraph",
  "sqlalchemy",
  "sqlmodel",
]

[[tool.importlinter.contracts]]
name = "only the gateway imports anthropic: the API calls and the key stay in one place (ADR-0021)"
type = "forbidden"
# Every package but the gateway, listed by hand: a test checks that none is missing.
source_modules = [
  "agency.agents",
  "agency.artifacts",
  "agency.cli",
  "agency.config",
  "agency.context",
  "agency.contracts",
  "agency.doctor",
  "agency.entrypoints",
  "agency.evaluation",
  "agency.insights",
  "agency.ledger",
  "agency.process",
  "agency.qa",
  "agency.registry",
  "agency.studio",
  "agency.telemetry",
  "agency.toolkit",
  "agency.workshop",
]
forbidden_modules = ["anthropic"]
# The CLI catches the gateway's re-export of the API error: importing anthropic through it is allowed.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "no import cycles between sibling modules, at any depth (STR-004)"
type = "acyclic_siblings"
ancestors = ["agency"]
