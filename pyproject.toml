[project]
name = "design-agency-harness"
version = "0.1.0"
description = "Harness proprietario della design agency: orchestrazione, contratti, Craft headless, QA e costi."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "anthropic>=1",
  "langgraph>=1",
  "langgraph-checkpoint-sqlite>=2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlmodel>=0.0.22",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "pillow>=11",
  "alembic>=1.20.0",
  "django>=5.2,<5.3",
  "django-ninja>=1.4",
]

[project.optional-dependencies]
context = ["lancedb>=0.20", "pillow>=11", "transformers>=4.50", "torch>=2.6"]
qa = ["trimesh>=4.5", "openimageio>=3.0"]
telemetry = ["langfuse>=3"]

[project.scripts]
agency = "agency.cli:main"
agency-server = "agency.entrypoints.server.serve:main"
agency-schemas = "agency.entrypoints.server.schema:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "pyright>=1.1.390",
    "import-linter>=2.15",
    "django-stubs>=5.2,<5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agency"]

[tool.uv]
# Nessun pacchetto pubblicato da meno di due settimane: difesa dalle compromissioni della supply chain (ADR-0006).
exclude-newer = "2026-10-17T00:00:00Z"

[tool.ruff]
line-length = 110
src = ["src", "tests"]
extend-exclude = ["legacy", "src/agency/qa/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # testi in italiano con ×, – e simili

[tool.pyright]
include = ["src", "tests"]
exclude = ["legacy", "src/agency/qa/scripts"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_package = "agency"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "insights legge e basta: niente motore, niente Ledger, niente librerie del motore (ADR-0019)"
type = "forbidden"
source_modules = ["agency.insights"]
forbidden_modules = [
  "agency.agents",
  "agency.artifacts",
  "agency.cli",
  "agency.evaluation",
  "agency.gateway",
  "agency.graph",
  "agency.ledger",
  "agency.qa",
  "agency.runtime",
  "agency.telemetry",
  "agency.tools",
  "alembic",
  "anthropic",
  "langgraph",
  "sqlalchemy",
  "sqlmodel",
]

[[tool.importlinter.contracts]]
name = "il motore non importa Django né il server: Django legge attraverso insights (ADR-0020)"
type = "forbidden"
# Ogni pacchetto tranne gli ingressi, elencato a mano: un test verifica che non ne manchi nessuno.
source_modules = [
  "agency.agents",
  "agency.artifacts",
  "agency.cli",
  "agency.config",
  "agency.context",
  "agency.contracts",
  "agency.doctor",
  "agency.evaluation",
  "agency.gateway",
  "agency.graph",
  "agency.insights",
  "agency.ledger",
  "agency.qa",
  "agency.runtime",
  "agency.telemetry",
  "agency.tools",
]
forbidden_modules = ["django", "ninja", "agency.entrypoints"]

[[tool.importlinter.contracts]]
name = "il server legge e basta: niente motore, niente Ledger, niente .env (ADR-0019)"
type = "forbidden"
source_modules = ["agency.entrypoints.server"]
forbidden_modules = [
  "agency.agents",
  "agency.artifacts",
  "agency.cli",
  "agency.config",
  "agency.evaluation",
  "agency.gateway",
  "agency.graph",
  "agency.ledger",
  "agency.qa",
  "agency.runtime",
  "agency.telemetry",
  "agency.tools",
  "alembic",
  "anthropic",
  "langgraph",
  "sqlalchemy",
  "sqlmodel",
]
