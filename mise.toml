# The local tools, each at a single version (ADR-0034). `mise install` installs them; with mise active in the
# shell they are the ones in use in this folder. Python is not mise's: .python-version picks it and uv installs it.
[tools]
node = "22.22.1"
pnpm = "12.14.0"
uv = "0.12.5"
task = "3.54.0"

[env]
# One more defense for ADR-0024: Next.js sends no telemetry from any shell of this project.
NEXT_TELEMETRY_DISABLED = "1"
# No `_.file = ".env"`: the API key stays in the file the gateway reads, never in the shells' environment.
