version: "3"

# The single entry point for commands (ADR-0020, ADR-0039): `task` lists everything, `make` is its alias. Docker:
# ADR-0040. The tools have the versions of mise.toml: with mise active in the shell they are on PATH, otherwise
# `mise exec -- task …`. No dotenv: the API key is in .env and only the gateway reads it; here it would reach
# every command, Next.js included.

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # A stale uv.lock fails every command instead of being rewritten (DX-004). Not in mise.toml, which would reach
  # the shell, where `uv add` and `uv lock` must keep working.
  UV_LOCKED: "1"

tasks:
  default:
    desc: I comandi, una riga ciascuno
    silent: true
    cmds:
      - task --list

  setup:
    desc: Le dipendenze dai lock, Python con uv e web/ con pnpm
    cmds:
      - uv sync --locked
      - pnpm --dir web install --frozen-lockfile

  check:
    desc: "Tutti i controlli prima di dichiarare finito un lavoro: Python, interfaccia, prove Playwright"
    cmds:
      - uv lock --check
      - task: lint
      - task: imports
      - task: types
      - task: test
      - task: web
      - task: e2e

  lint:
    desc: Le regole e il formato di Ruff
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  format:
    desc: "Corregge e formatta il Python con Ruff: ciò che lint segnala e si sistema da solo"
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  imports:
    desc: I confini tra moduli, con import-linter
    cmds:
      - uv run lint-imports

  types:
    desc: I tipi di Python, con pyright
    cmds:
      - uv run pyright

  test:
    desc: "Le prove di Python; per una sola: task test -- tests/test_server.py"
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  web:
    desc: "L'interfaccia senza server: tipi dallo schema, TypeScript, prove unitarie, difese di ADR-0024"
    preconditions: &modules
      - sh: test -d web/node_modules
        msg: "web/node_modules manca: esegui task setup"
    cmds:
      - pnpm --dir web run api:check
      - pnpm --dir web run typecheck
      - pnpm --dir web run test
      - pnpm --dir web run defenses

  e2e:
    desc: "Le prove Playwright, sui server veri e sulla build di produzione; per una sola: task e2e -- e2e/run.spec.ts"
    preconditions: *modules
    cmds:
      - pnpm --dir web run build:e2e
      - pnpm --dir web exec playwright test {{.CLI_ARGS}}

  schemas:
    desc: Rigenera schemas/openapi.json dai modelli di lettura, e da lì i tipi TypeScript
    cmds:
      - uv run agency-schemas
      - pnpm --dir web run api:types

  doctor:
    desc: Gli strumenti della macchina
    cmds:
      - uv run agency doctor

  dashboard:
    desc: "Il cruscotto: API su http://127.0.0.1:8000/api/, interfaccia su http://127.0.0.1:3000"
    # If one of the two stops, so does the other: an interface without the API would show only an error.
    failfast: true
    deps: [dashboard:api, dashboard:ui]

  dashboard:dev:
    desc: Il cruscotto con l'interfaccia ricaricata a ogni modifica
    failfast: true
    deps: [dashboard:api, dashboard:watch]

  dashboard:api:
    desc: Solo l'API Django, in sola lettura, su loopback
    cmds:
      - uv run agency-server

  dashboard:build:
    desc: La build di produzione dell'interfaccia, rifatta solo se cambiano le sue fonti
    preconditions: *modules
    sources:
      - web/src/**/*
      - web/scripts/**/*
      - web/next.config.mjs
      - web/package.json
      - web/pnpm-lock.yaml
      - web/tsconfig.json
    generates:
      - web/.next/standalone/server.js
    cmds:
      - pnpm --dir web run build

  dashboard:ui:
    desc: Solo l'interfaccia, dalla build di produzione, su loopback
    deps: [dashboard:build]
    cmds:
      - pnpm --dir web run start

  docker:up:
    desc: "Il cruscotto in Docker su http://127.0.0.1:3000; il registro è .data, o AGENCY_DATA_DIR se lo dai"
    # The same rules as the engine and the server (ADR-0045): Compose would resolve a relative path against
    # docker/, and the old name would be ignored silently.
    preconditions:
      - sh: test -z "${AGENCY_DATA+x}"
        msg: "AGENCY_DATA non si usa più: il registro si indica con AGENCY_DATA_DIR, un percorso assoluto"
      - sh: 'case "${AGENCY_DATA_DIR:-/}" in /*) ;; *) exit 1 ;; esac'
        msg: "AGENCY_DATA_DIR deve essere un percorso assoluto"
      # A bind mount of a missing folder fails only after both images are built (DX-010).
      - sh: test -d '{{.AGENCY_DATA_DIR | default (printf "%s/.data" .ROOT_DIR)}}'
        msg: 'Il registro {{.AGENCY_DATA_DIR | default (printf "%s/.data" .ROOT_DIR)}} non esiste: avvia prima un progetto con agency run, o indica la cartella con AGENCY_DATA_DIR'
    env: &compose
      AGENCY_DATA_DIR: '{{.AGENCY_DATA_DIR | default (printf "%s/.data" .ROOT_DIR)}}'
      AGENCY_UID:
        sh: id -u
      AGENCY_GID:
        sh: id -g
    cmds:
      - docker compose -f docker/compose.yaml up --build

  docker:down:
    desc: Ferma il cruscotto in Docker e toglie i suoi container
    env: *compose
    cmds:
      - docker compose -f docker/compose.yaml down

  dashboard:watch:
    internal: true
    preconditions: *modules
    cmds:
      - pnpm --dir web run dev
